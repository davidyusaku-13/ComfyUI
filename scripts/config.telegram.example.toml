# ==========================================
# Telegram Bot Configuration for ComfyUI
# ==========================================

[telegram]
# Token bot Telegram yang didapatkan dari @BotFather
bot_token = "YOUR_TELEGRAM_BOT_TOKEN_HERE"

# List ID pengguna Telegram yang diizinkan (dapatkan ID Anda dari @userinfobot)
# Bot hanya akan memproses perintah dari user ID yang terdaftar di sini (whitelist)
allowed_user_ids = [123456789]

[comfyui]
# URL dan WebSocket server ComfyUI lokal
server_url = "http://127.0.0.1:8188"
ws_url = "ws://127.0.0.1:8188/ws"
